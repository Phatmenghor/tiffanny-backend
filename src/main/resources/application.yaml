# ================================
#  Tiffany Platform Config
# ================================
spring:
  application:
    name: cambodia-tiffany-platform

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://152.42.254.193:5432/tiffany_platform
    username: admin_user
    password: Hour1819
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

# ================================
#  SERVER CONFIG
# ================================
server:
  port: 9090

# ================================
#  JWT CONFIGURATION
# ================================
jwt:
  secret: da2bd42bef8f9f957d647ed13571d35b59css7055fb723eacdsb05154878da17d77d3180385fc232cab38bded0fc7dbda0d439cc275e91164ade266d64d50633bc7
  expiration: 99999999999999999

# ================================
#  API DOCS / SWAGGER
# ================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# ================================
#  ACTUATOR MONITORING
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ================================
#  CAMBODIA SETTINGS
# ================================
cambodia:
  timezone: "Asia/Phnom_Penh"
  currency: "USD"
  language: "km"
  country: "KH"

